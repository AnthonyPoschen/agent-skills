name: vendor-apstack-skills

on:
  workflow_call:
    inputs:
      sha:
        description: Full 40-character commit SHA of AnthonyPoschen/agent-skills to vendor.
        required: true
        type: string
      dest:
        description: Skills directory in the caller repository. Cursor loads .agents/skills and .cursor/skills.
        required: false
        type: string
        default: .agents/skills

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout apstack at the pinned SHA
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "sha must be a full 40-character hex commit"; exit 1; }
          git init -q "$RUNNER_TEMP/apstack"
          git -C "$RUNNER_TEMP/apstack" remote add origin https://github.com/AnthonyPoschen/agent-skills.git
          git -C "$RUNNER_TEMP/apstack" fetch -q --depth 1 origin "$SHA"
          git -C "$RUNNER_TEMP/apstack" checkout -q --detach FETCH_HEAD

      - name: Vendor skills
        id: vendor
        env:
          SHA: ${{ inputs.sha }}
          DEST: ${{ inputs.dest }}
        run: |
          set -euo pipefail
          case "$DEST" in
            ""|/*|*..*) echo "dest must be a relative skills directory without .."; exit 1;;
          esac
          bash "$RUNNER_TEMP/apstack/scripts/vendor-apstack-skills.sh" \
            --source "$RUNNER_TEMP/apstack" \
            --sha "$SHA" \
            --dest "$DEST"

      - name: Open or update pull request
        if: steps.vendor.outputs.changed == 'true'
        env:
          SHA: ${{ inputs.sha }}
          DEST: ${{ inputs.dest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="vendor/apstack-skills"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A -- "$DEST"
          git diff --cached --quiet && exit 0
          git commit -m "vendor apstack skills at ${SHA}"
          if git fetch -q origin "$branch"; then
            git push --force-with-lease origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          body="$(mktemp)"
          printf 'Vendored apstack skills from `AnthonyPoschen/agent-skills` at `%s` into `%s`.\n\nOnly names listed in `%s/.apstack-vendor.json` are updated or removed.\n' \
            "$SHA" "$DEST" "$DEST" > "$body"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          title="vendor apstack skills at ${SHA:0:12}"
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "$body"
          else
            base="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
            gh pr create --draft --base "$base" --head "$branch" --title "$title" --body-file "$body"
          fi
