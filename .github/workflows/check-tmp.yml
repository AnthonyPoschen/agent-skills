name: check-tmp

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check-tmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard against literal fixed /tmp paths
        run: npm run check-tmp
