# Merge into Cargo.toml ([lints.clippy]) or [workspace.lints.clippy].
# Binaries, build.rs, tests and examples may opt out per crate or per item with
# #[allow(...)] plus a reason; library code may not.
[lints.clippy]
# Panics in library code crash the host process.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Libraries report through return values or a logger, never stdout/stderr.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# `as` silently truncates, wraps or drops the sign. Use From/TryFrom.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# Enforces the disallowed-methods list in clippy.toml.
disallowed_methods = "deny"
