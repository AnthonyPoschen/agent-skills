spec:
  containers:
    - name: app
      # ruleid: container-resource-limits
      image: nginx:1.27.2
    - name: cpu-only
      # ruleid: container-resource-limits
      image: nginx:1.27.2
      resources:
        limits:
          cpu: 500m
    - name: limited
      # ok: container-resource-limits
      image: nginx:1.27.2
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi
      env:
        - name: LOG_LEVEL
          value: info
    - resources:
        limits:
          memory: 64Mi
      # ok: container-resource-limits
      image: busybox:1.36
